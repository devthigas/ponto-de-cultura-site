<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != "Início" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Arte, Cultura e Inclusão Social em Canela, RS{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="keywords" content="ong, ponto de cultura, kombinação, canela, gramado, rio grande do sul, oficinas gratuitas, arte-educação, circo, música, teatro, artesanato, inclusão social">
    <meta name="author" content="Ponto de Cultura Kombinação">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title and page.title != "Início" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Arte, Cultura e Inclusão Social{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:image" content="{{ '/assets/images/kombi_cultural.png' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/icone-kombi.avif' | relative_url }}" type="image/avif">

    <!-- Google Fonts: Limelight, Roboto & Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Limelight&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    {% include tailwind.html %}

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="flex flex-col min-h-screen bg-white text-ink font-sans antialiased">

    {% include header.html %}

    <!-- CONTENT -->
    {{ content }}

    {% include footer.html %}

    <!-- Scripts -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    {% if page.extra_js %}
      {% for script_url in page.extra_js %}
        <script src="{{ script_url | relative_url }}"></script>
      {% endfor %}
    {% endif %}
</body>
</html>
